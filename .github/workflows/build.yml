name: Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore NuGet package cache
        uses: actions/cache@v5
        with:
          path: AGFramework/packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('AGFramework/packages.config', 'AGFramework/AGFramework.vcxproj') }}
          restore-keys: |
            nuget-packages-${{ runner.os }}-

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore AGFramework/packages.config -PackagesDirectory AGFramework/packages

      - name: Build Debug x64
        shell: pwsh
        run: >
          msbuild AGFramework/AGFramework.vcxproj
          /m
          /p:Configuration=Debug
          /p:Platform=x64
          /p:PlatformToolset=v143
          /verbosity:minimal
